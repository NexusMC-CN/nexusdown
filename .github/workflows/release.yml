name: Release

on:
  push:
    tags: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (typeof version !== 'string' || !version || (tag !== version && tag !== `v${version}`)) {
            console.error(`Tag ${tag} does not match package.json version ${version}.`);
            process.exit(1);
          }
          console.log(`Validated release ${tag} for package version ${version}.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package exports
        run: npm run check:exports

      - name: Pack tgz
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets

      - name: Upload tgz and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Upload to a draft first so published releases include the package.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(node -p "JSON.parse(require('fs').readFileSync('release-state.json', 'utf8')).isDraft")" != "true" ]; then
              echo "::error::Release already published; refusing to replace its assets."
              exit 1
            fi
          else
            prerelease=()
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              prerelease+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.tgz --clobber
          gh release edit "$RELEASE_TAG" --draft=false
