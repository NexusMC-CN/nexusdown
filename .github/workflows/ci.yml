name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the oldest LTS with stable `require(esm)`; 24 is current LTS and
        # matches the local development toolchain.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter @nexusmc-cn/nexusdown install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Dependency installation and builds must not rewrite tracked inputs.
      - name: Build output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build produced uncommitted changes. Run 'pnpm run build' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi

      - name: Package contents
        run: pnpm run pack:check

  consumer:
    name: consumer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter @nexusmc-cn/nexusdown install --frozen-lockfile

      # Packs the tarball, installs it into a throwaway project and builds a real
      # Vite app against it. This is the only check that can catch packaging
      # regressions such as an unresolvable `exports` subpath, a file missing
      # from `files[]`, or a stale generated entry shim.
      - name: Consumer smoke test
        run: pnpm run test:consumer

  nuxt-ssr:
    name: Framework examples (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The root prepare hook builds the workspace-linked editor package.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vue example
        run: pnpm run build:vue-example

      - name: Build Astro example
        run: pnpm run build:astro-example

      - name: Build Nuxt SSR example
        run: pnpm run build:nuxt-example

      - name: Check Nuxt SSR output
        working-directory: examples/nuxt-ssr
        run: test -f .output/server/index.mjs

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Advisory only: the repo's history contains non-conforming Chinese subjects
    # that predate this config. Flip `continue-on-error` to false once the
    # convention is enforced going forward.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter @nexusmc-cn/nexusdown install --frozen-lockfile

      - name: Lint commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
